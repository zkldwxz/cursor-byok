# The encrypted connection between a computer and a phone.
[package]
name = "remote-link"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "1.5", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
