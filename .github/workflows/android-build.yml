# Builds an installable Android package of the phone app, without releasing it.
# It is signed with a key made for this run, so a newer build replaces an older
# one only after that was uninstalled.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["build/**"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/cnod.svg
          cp src-tauri/android/MainActivity.kt src-tauri/android/Work.kt src-tauri/gen/android/app/src/main/java/dev/cursorbyok/mobile/
          cp -R src-tauri/android/res/. src-tauri/gen/android/app/src/main/res/
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          permissions=""
          for name in VIBRATE POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_REMOTE_MESSAGING; do
            permissions="$permissions\n    <uses-permission android:name=\"android.permission.$name\" />"
          done
          sed -i "s|<uses-permission android:name=\"android.permission.INTERNET\" />|&$permissions|" "$manifest"
          sed -i 's|</application>|    <service android:name=".Work" android:exported="false" android:foregroundServiceType="remoteMessaging" />\n    </application>|' "$manifest"
          grep -q FOREGROUND_SERVICE_REMOTE_MESSAGING "$manifest"
          grep -q 'android:name=".Work"' "$manifest"
          npm run tauri -- android build --ci --apk --target aarch64

      - name: Sign
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          built=$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk')
          password=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/key.jks" -storepass "$password" -alias app \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Cursor BYOK preview"
          "$tools/zipalign" -f -p 4 "$built" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/key.jks" --ks-pass "pass:$password" \
            --out cursor-byok-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify cursor-byok-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-android-arm64
          path: cursor-byok-android-arm64.apk
          if-no-files-found: error
          retention-days: 5
