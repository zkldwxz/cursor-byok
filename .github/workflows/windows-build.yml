name: Windows build (manual)

# Produces an installable NSIS package on demand, without touching releases.
# `ci.yml` only compiles and checks; this workflow is how a maintainer gets a
# runnable artifact from a branch before any tag exists.
on:
  workflow_dispatch:
  push:
    branches:
      - remove-promotions

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: apps/desktop
        # The updater artifacts need TAURI_SIGNING_PRIVATE_KEY, which this
        # workflow deliberately does not hold: it produces a local installer,
        # not a release. Turn them off rather than fail after a 15-minute build.
        run: npm run tauri:build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
