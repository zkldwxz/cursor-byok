name: Test build

on:
  push:
    branches:
      - test/model-note-label

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            bundle: deb
            target: ''
            artifact: target/release/bundle/deb/*.deb
          - platform: windows-x86_64
            os: windows-latest
            bundle: nsis
            target: ''
            artifact: target/release/bundle/nsis/*.exe
          - platform: macos-aarch64
            os: macos-15
            bundle: app
            target: aarch64-apple-darwin
            artifact: target/aarch64-apple-darwin/release/bundle/macos/*.zip
          - platform: macos-x86_64
            os: macos-15-intel
            bundle: app
            target: x86_64-apple-darwin
            artifact: target/x86_64-apple-darwin/release/bundle/macos/*.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }} --config ../../.github/test-build-tauri.conf.json ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Package macOS application
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          app_dir="target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent "${app_dir}/Cursor BYOK.app" "${app_dir}/Cursor-BYOK-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
