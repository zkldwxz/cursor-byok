# Defines the server crate, binaries, and dependency graph.
[package]
name = "cursor-server"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "cursor-server"

[lib]
name = "cursor_server"

[[bin]]
name = "cursor-server"
path = "src/bin/cursor-server.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
dom_smoothie = "0.18"
dirs = "6"
encoding_rs = "0.8"
eventsource-stream = "0.2"
futures-util = "0.3"
gethostname = "1"
hex = "0.4"
hudsucker = { version = "0.25", features = ["http2"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
include_dir = "0.7"
json5 = "0.4"
parking_lot = "0.12"
pem = "3"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "native-tls", "socks", "stream", "system-proxy", "zstd"] }
rmcp = { version = "0.8.5", features = ["client", "transport-streamable-http-client-reqwest"] }
regex = "1"
remote-link = { path = "../crates/remote-link" }
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "decompression-gzip", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
zip = { version = "4", default-features = false, features = ["deflate"] }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
flate2 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the live system proxy entries hyper-util freezes into each reqwest
# client, for the fingerprint that rebuilds stale clients on proxy changes.
system-configuration = "0.7"

[target.'cfg(windows)'.dependencies]
# Reads the same registry values hyper-util freezes into each reqwest client,
# for the fingerprint that rebuilds stale clients on proxy changes.
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry"] }
